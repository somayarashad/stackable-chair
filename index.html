<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كرسي استاكبول — متابعة التوريد</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#e1e6ed;--ac:#1f6feb;--ok:#1a9d5b;--warn:#e08a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#4c9aff;--ok:#38c07b;--warn:#f0a63a}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#4c9aff;--ok:#38c07b;--warn:#f0a63a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:760px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px;margin:4px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=date]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;font:inherit}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}.c b{display:block;font-size:24px;margin-top:4px}.c span{font-size:12px;color:var(--mut)}.t{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 14px;overflow-x:auto}.r{display:grid;grid-template-columns:1.3fr .8fr .9fr .8fr 2fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);min-width:520px;font-size:14px}.r:last-child{border:0}.r.h{color:var(--mut);font-size:12px}.r input{width:80px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;font:inherit;text-align:center}.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}.p{font-size:12px;color:var(--mut);margin-top:3px}.n{color:var(--mut);font-size:12px;margin-top:10px}@media (max-width:520px){.k{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="w"><h1>كرسي استاكبول — جامعة كيان</h1><div class="sub">متابعة التوريد حتى تاريخ: <input type="date" id="dt"> <button id="sv" style="display:none;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:4px 12px;font:inherit;cursor:pointer">حفظ التعديلات</button></div><div class="k"><div class="c"><span>إجمالي المطلوب</span><b id="kReq">3,780</b></div><div class="c"><span>إجمالي التسليمات (تجميع)</span><b id="kDel">0</b></div><div class="c"><span>المتبقي</span><b id="kRem">0</b></div><div class="c"><span>نسبة الإنجاز</span><b id="kPct">0%</b></div></div><div class="t" id="tb"></div><div class="n">الأرقام بتتحدث يوميًا.</div></div>
<script id="state" type="application/json">{"date":"2026-10-01","items":[{"n":"ظهر الكرسي (Back Foam)","r":3780,"d":2185},{"n":"قاعدة الكرسي (Seat Foam)","r":3780,"d":2155},{"n":"الشاسيه المدهون","r":3780,"d":2205},{"n":"الكرسي النهائي — إنتاج","r":3780,"d":1860},{"n":"الكرسي النهائي — تجميع","r":3780,"d":1710}]}</script>
<script>const ST=JSON.parse(document.getElementById("state").textContent);let canEdit=false,dirty=false,art=null;const f=n=>n.toLocaleString("en-US");const items=ST.items;const dt=document.getElementById("dt");dt.value=ST.date;function render(){const tb=document.getElementById("tb");tb.innerHTML='<div class="r h"><div>البند</div><div>المطلوب</div><div>تم التوريد</div><div>المتبقي</div><div>الإنجاز</div></div>'+items.map((i,x)=>{const rem=Math.max(i.r-i.d,0),p=Math.min(i.d/i.r*100,100);const rq=canEdit?`<input type="number" min="0" value="${i.r}" data-x="${x}" data-f="r">`:f(i.r);const dl=canEdit?`<input type="number" min="0" value="${i.d}" data-x="${x}" data-f="d">`:`<b>${f(i.d)}</b>`;return `<div class="r"><div>${i.n}</div><div>${rq}</div><div>${dl}</div><div><b>${f(rem)}</b></div><div><div class="bar"><i style="width:${p}%"></i></div><div class="p">${p.toFixed(0)}%</div></div></div>`}).join("");const m=items[4],rem=Math.max(m.r-m.d,0);kReq.textContent=f(m.r);kDel.textContent=f(m.d);kRem.textContent=f(rem);kPct.textContent=Math.min(m.d/m.r*100,100).toFixed(1)+"%";dt.disabled=!canEdit;sv.style.display=canEdit?"inline-block":"none";tb.querySelectorAll("input").forEach(el=>el.addEventListener("change",e=>{items[+e.target.dataset.x][e.target.dataset.f]=Math.max(+e.target.value||0,0);dirty=true;render();}));}dt.addEventListener("change",()=>{ST.date=dt.value;dirty=true});sv.addEventListener("click",async()=>{if(!art)return;sv.disabled=true;sv.textContent="جاري الحفظ...";try{const src=await(await fetch(location.href.split("#")[0])).text();const html=src.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify(ST).replace(/</g,"\\u003c")+b);await art.publish(html);}catch(e){sv.disabled=false;sv.textContent="تعذر الحفظ — حاول مرة أخرى"}});(async()=>{try{const u=await claude.use("user");art=await claude.use("artifact");canEdit=!!(art&&u&&u.canEdit());render();}catch(e){}})();render();</script></body></html>
