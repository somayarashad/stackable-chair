<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كرسي استاكبول — متابعة التوريد</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#edf5ff;--card:#fff;--tx:#15243b;--mut:#6b7890;--bd:#dbe7f5;--ac:#2478ed;--ok:#1a9d5b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#dceeff 0,transparent 26%),radial-gradient(circle at 90% 85%,#d9eaff 0,transparent 25%),linear-gradient(145deg,#f7fbff,#eaf4ff);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:26px}.w{max-width:1120px;margin:auto;padding:28px;background:linear-gradient(145deg,#ffffffee,#f5faffee);border:2px solid #86baf8;border-radius:26px;box-shadow:0 18px 50px #347fd31f,0 3px 12px #347fd318;position:relative;overflow:hidden}.w:before,.w:after{content:"";position:absolute;border-radius:50%;background:#dcecff66;z-index:0}.w:before{width:190px;height:190px;left:-90px;top:-100px}.w:after{width:230px;height:230px;right:-130px;bottom:-150px}.w>*{position:relative;z-index:1}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}.sub{color:var(--mut);font-size:14px;margin:8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cutoff{display:inline-flex;align-items:center;gap:6px;color:#1859b8;background:#eef6ff;border:1.5px solid #8dbdf7;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 6px #1f6feb14}.cutoff::before{content:'▣';font-size:13px;color:var(--ac)}.btn{border:0;border-radius:9px;padding:9px 15px;font:inherit;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--ac);color:white;box-shadow:0 5px 12px #2478ed35}.ghost{background:#fff;border:1.5px solid #9fc5f3;color:var(--tx);box-shadow:0 4px 12px #347fd315}.pdfbtn{background:#fff5f3;border:1.5px solid #efaaa0;color:#a73325;box-shadow:0 4px 12px #b84b3c16;font-weight:650}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.c,.t,.modalbox{background:#fff;border:1px solid var(--bd);border-radius:16px}.c{padding:18px 14px;text-align:center;box-shadow:0 7px 20px #347fd310;position:relative;overflow:hidden}.c:before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,#8cc0ff,#2478ed)}.c:nth-child(2):before{background:linear-gradient(90deg,#ffd895,#f3a42f)}.c:nth-child(3):before{background:linear-gradient(90deg,#9ee9cf,#31b889)}.c:nth-child(4):before{background:linear-gradient(90deg,#c9b4ff,#8266e8)}.c b{display:block;font-size:28px;margin-top:7px;color:#0f1f36}.c span{font-size:13px;color:var(--mut)}.t{padding:10px 16px;overflow-x:auto;box-shadow:0 8px 24px #347fd312;border:1px solid #d6e5f5}.r{display:grid;grid-template-columns:1.3fr .8fr .9fr .8fr 2fr;gap:10px;align-items:center;padding:15px 10px;border-bottom:1px solid var(--bd);min-width:720px;font-size:14px}.r:last-child{border:0}.r.h{color:#4e6684;font-size:12px;background:#eef6ff;border-radius:10px;border:0;margin-bottom:2px;font-weight:650}.r input{width:90px;background:#f7fbff;color:var(--tx);border:1px solid #b9d4f3;border-radius:7px;padding:6px;text-align:center}.bar{height:11px;background:#dfe8f2;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b8df5,#1670e8);border-radius:7px}.p,.n{font-size:12px;color:var(--mut)}.p{margin-top:4px}.n{margin-top:12px;padding:0 6px}.adminbar{display:none;gap:8px;align-items:center;margin:0 0 14px}.adminbar.show{display:flex}.modal{display:none;position:fixed;inset:0;background:#0d244466;backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{width:min(360px,100%);padding:22px;box-shadow:0 18px 50px #102a4b35}.modalbox h2{margin:0 0 14px}.field{width:100%;padding:10px;border:1px solid #b9d4f3;border-radius:8px;margin:5px 0 10px;font:inherit}.err{color:#b42318;font-size:12px;min-height:18px}.status{font-size:12px;color:var(--ok)}@media(max-width:720px){body{padding:10px}.w{padding:16px;border-radius:18px}.k{grid-template-columns:repeat(2,1fr)}h1{font-size:20px}}@media(max-width:420px){.k{grid-template-columns:1fr 1fr}.c{padding:14px 8px}.c b{font-size:22px}}@media print{body{padding:0;background:#fff}.w{max-width:none;border:1px solid #aac9ec;box-shadow:none;border-radius:0;padding:18px}.header-actions,.adminbar{display:none!important}.w:before,.w:after{display:none}.t{overflow:visible;box-shadow:none}.r{min-width:0;font-size:12px}.c{box-shadow:none}@page{size:A4 landscape;margin:10mm}}
</style></head><body><div class="w"><header><div><h1>كرسي استاكبول — جامعة كيان</h1><div class="sub"><span>متابعة الإنتاج والتوريد —</span><span class="cutoff">حتى تاريخ 15/10</span></div></div><div class="header-actions"><button id="pdfBtn" class="btn pdfbtn">تنزيل PDF</button><button id="adminBtn" class="btn ghost">دخول الإدارة</button></div></header><div id="adminbar" class="adminbar"><button id="saveBtn" class="btn primary">حفظ التعديلات</button><button id="logoutBtn" class="btn ghost">خروج</button><span id="saveStatus" class="status"></span></div><div class="k"><div class="c"><span>إجمالي المطلوب</span><b id="kReq">—</b></div><div class="c"><span>إجمالي التسليمات</span><b id="kDel">—</b></div><div class="c"><span>المتبقي</span><b id="kRem">—</b></div><div class="c"><span>نسبة الإنجاز</span><b id="kPct">—</b></div></div><div class="t" id="tb">جاري تحميل البيانات...</div><div class="n" id="updated"></div></div><div class="modal" id="loginModal"><div class="modalbox"><h2>دخول الإدارة</h2><input id="pass" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password"><div id="loginErr" class="err"></div><button id="loginBtn" class="btn primary">دخول</button> <button id="cancelBtn" class="btn ghost">إلغاء</button></div></div>
<script>
const {createClient}=supabase,db=createClient('https://ncartouivsajjbpivuhs.supabase.co','sb_publishable_MlN1pJs4oh-48_wb-h_AJg_ZvpxQBEY');let items=[],editing=false,password='';const $=id=>document.getElementById(id),f=n=>Number(n||0).toLocaleString('en-US');
async function load(){const {data,error}=await db.from('stackable_chair_status').select('*').order('sort_order');if(error){$('tb').textContent='تعذر تحميل البيانات';return}items=data;render();const latest=data.reduce((a,b)=>new Date(a.updated_at)>new Date(b.updated_at)?a:b);$('updated').textContent='آخر تحديث: '+new Date(latest.updated_at).toLocaleString('ar-EG')}
function render(){$('tb').innerHTML='<div class="r h"><div>البند</div><div>المطلوب</div><div>تم التوريد</div><div>المتبقي</div><div>الإنجاز</div></div>'+items.map((i,x)=>{const rem=Math.max(i.required_qty-i.completed_qty,0),p=i.required_qty?Math.min(i.completed_qty/i.required_qty*100,100):0,rq=editing?`<input type="number" min="0" value="${i.required_qty}" data-x="${x}" data-f="required_qty">`:f(i.required_qty),dl=editing?`<input type="number" min="0" value="${i.completed_qty}" data-x="${x}" data-f="completed_qty">`:`<b>${f(i.completed_qty)}</b>`;let label=i.item_name_ar+(i.item_name_en?' ('+i.item_name_en+')':'');if(i.item_key==='final_assembly')label='الكرسي النهائي — توريد (Final Chair — Deliveries)';return `<div class="r"><div>${label}</div><div>${rq}</div><div>${dl}</div><div><b>${f(rem)}</b></div><div><div class="bar"><i style="width:${p}%"></i></div><div class="p">${p.toFixed(0)}%</div></div></div>`}).join('');const m=items.find(i=>i.item_key==='final_assembly')||items.at(-1);if(m){const rem=Math.max(m.required_qty-m.completed_qty,0);$('kReq').textContent=f(m.required_qty);$('kDel').textContent=f(m.completed_qty);$('kRem').textContent=f(rem);$('kPct').textContent=(m.required_qty?Math.min(m.completed_qty/m.required_qty*100,100):0).toFixed(1)+'%'}$('tb').querySelectorAll('input').forEach(el=>el.oninput=e=>items[+e.target.dataset.x][e.target.dataset.f]=Math.max(0,Math.trunc(+e.target.value||0)))}
$('pdfBtn').onclick=()=>{window.print()};
$('adminBtn').onclick=()=>{$('loginModal').classList.add('show');$('pass').focus()};$('cancelBtn').onclick=()=>$('loginModal').classList.remove('show');
$('loginBtn').onclick=async()=>{const p=$('pass').value;$('loginErr').textContent='';const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:p})});if(!r.ok){$('loginErr').textContent='كلمة المرور غير صحيحة';return}password=p;editing=true;$('loginModal').classList.remove('show');$('adminBtn').style.display='none';$('adminbar').classList.add('show');render()};
$('logoutBtn').onclick=()=>{password='';editing=false;$('adminbar').classList.remove('show');$('adminBtn').style.display='inline-block';$('pass').value='';load()};
$('saveBtn').onclick=async()=>{$('saveBtn').disabled=true;$('saveStatus').textContent='جاري الحفظ...';const rows=items.map(i=>({item_key:i.item_key,required_qty:i.required_qty,completed_qty:i.completed_qty}));const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',password,rows})});$('saveBtn').disabled=false;if(!r.ok){$('saveStatus').textContent='تعذر الحفظ';return}$('saveStatus').textContent='تم الحفظ ✓';await load();setTimeout(()=>$('saveStatus').textContent='',2500)};$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});load();
</script></body></html>
