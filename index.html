<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كرسي استاكبول — متابعة التوريد</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#e1e6ed;--ac:#1f6feb;--ok:#1a9d5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:800px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px;margin:4px 0 14px}.cutoff{color:var(--tx);font-weight:700;font-size:14px}.btn{border:0;border-radius:7px;padding:7px 13px;font:inherit;cursor:pointer}.primary{background:var(--ac);color:white}.ghost{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.c,.t,.modalbox{background:var(--card);border:1px solid var(--bd);border-radius:12px}.c{padding:12px;text-align:center}.c b{display:block;font-size:24px;margin-top:4px}.c span{font-size:12px;color:var(--mut)}.t{padding:6px 14px;overflow-x:auto}.r{display:grid;grid-template-columns:1.3fr .8fr .9fr .8fr 2fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);min-width:560px;font-size:14px}.r:last-child{border:0}.r.h{color:var(--mut);font-size:12px}.r input{width:90px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px;text-align:center}.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}.p,.n{font-size:12px;color:var(--mut)}.n{margin-top:10px}.adminbar{display:none;gap:8px;align-items:center;margin:0 0 12px}.adminbar.show{display:flex}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{width:min(360px,100%);padding:20px}.modalbox h2{margin:0 0 14px}.field{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;margin:5px 0 10px;font:inherit}.err{color:#b42318;font-size:12px;min-height:18px}.status{font-size:12px;color:var(--ok)}@media(max-width:520px){.k{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="w"><header><div><h1>كرسي استاكبول — جامعة كيان</h1><div class="sub">متابعة الإنتاج والتوريد — <span class="cutoff">حتى تاريخ 15/10</span></div></div><button id="adminBtn" class="btn ghost">دخول الإدارة</button></header><div id="adminbar" class="adminbar"><button id="saveBtn" class="btn primary">حفظ التعديلات</button><button id="logoutBtn" class="btn ghost">خروج</button><span id="saveStatus" class="status"></span></div><div class="k"><div class="c"><span>إجمالي المطلوب</span><b id="kReq">—</b></div><div class="c"><span>إجمالي التسليمات</span><b id="kDel">—</b></div><div class="c"><span>المتبقي</span><b id="kRem">—</b></div><div class="c"><span>نسبة الإنجاز</span><b id="kPct">—</b></div></div><div class="t" id="tb">جاري تحميل البيانات...</div><div class="n" id="updated"></div></div><div class="modal" id="loginModal"><div class="modalbox"><h2>دخول الإدارة</h2><input id="pass" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password"><div id="loginErr" class="err"></div><button id="loginBtn" class="btn primary">دخول</button> <button id="cancelBtn" class="btn ghost">إلغاء</button></div></div>
<script>
const {createClient}=supabase,db=createClient('https://ncartouivsajjbpivuhs.supabase.co','sb_publishable_MlN1pJs4oh-48_wb-h_AJg_ZvpxQBEY');let items=[],editing=false,password='';const $=id=>document.getElementById(id),f=n=>Number(n||0).toLocaleString('en-US');
async function load(){const {data,error}=await db.from('stackable_chair_status').select('*').order('sort_order');if(error){$('tb').textContent='تعذر تحميل البيانات';return}items=data;render();const latest=data.reduce((a,b)=>new Date(a.updated_at)>new Date(b.updated_at)?a:b);$('updated').textContent='آخر تحديث: '+new Date(latest.updated_at).toLocaleString('ar-EG')}
function render(){$('tb').innerHTML='<div class="r h"><div>البند</div><div>المطلوب</div><div>تم التوريد</div><div>المتبقي</div><div>الإنجاز</div></div>'+items.map((i,x)=>{const rem=Math.max(i.required_qty-i.completed_qty,0),p=i.required_qty?Math.min(i.completed_qty/i.required_qty*100,100):0,rq=editing?`<input type="number" min="0" value="${i.required_qty}" data-x="${x}" data-f="required_qty">`:f(i.required_qty),dl=editing?`<input type="number" min="0" value="${i.completed_qty}" data-x="${x}" data-f="completed_qty">`:`<b>${f(i.completed_qty)}</b>`;let label=i.item_name_ar+(i.item_name_en?' ('+i.item_name_en+')':'');if(i.item_key==='final_assembly')label='الكرسي النهائي — توريد (Final Chair — Deliveries)';return `<div class="r"><div>${label}</div><div>${rq}</div><div>${dl}</div><div><b>${f(rem)}</b></div><div><div class="bar"><i style="width:${p}%"></i></div><div class="p">${p.toFixed(0)}%</div></div></div>`}).join('');const m=items.find(i=>i.item_key==='final_assembly')||items.at(-1);if(m){const rem=Math.max(m.required_qty-m.completed_qty,0);$('kReq').textContent=f(m.required_qty);$('kDel').textContent=f(m.completed_qty);$('kRem').textContent=f(rem);$('kPct').textContent=(m.required_qty?Math.min(m.completed_qty/m.required_qty*100,100):0).toFixed(1)+'%'}$('tb').querySelectorAll('input').forEach(el=>el.oninput=e=>items[+e.target.dataset.x][e.target.dataset.f]=Math.max(0,Math.trunc(+e.target.value||0)))}
$('adminBtn').onclick=()=>{$('loginModal').classList.add('show');$('pass').focus()};$('cancelBtn').onclick=()=>$('loginModal').classList.remove('show');
$('loginBtn').onclick=async()=>{const p=$('pass').value;$('loginErr').textContent='';const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:p})});if(!r.ok){$('loginErr').textContent='كلمة المرور غير صحيحة';return}password=p;editing=true;$('loginModal').classList.remove('show');$('adminBtn').style.display='none';$('adminbar').classList.add('show');render()};
$('logoutBtn').onclick=()=>{password='';editing=false;$('adminbar').classList.remove('show');$('adminBtn').style.display='inline-block';$('pass').value='';load()};
$('saveBtn').onclick=async()=>{$('saveBtn').disabled=true;$('saveStatus').textContent='جاري الحفظ...';const rows=items.map(i=>({item_key:i.item_key,required_qty:i.required_qty,completed_qty:i.completed_qty}));const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',password,rows})});$('saveBtn').disabled=false;if(!r.ok){$('saveStatus').textContent='تعذر الحفظ';return}$('saveStatus').textContent='تم الحفظ ✓';await load();setTimeout(()=>$('saveStatus').textContent='',2500)};$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});load();
</script></body></html>
